<template :fill="'hero'">
  <section [hero-panel]>
    <h2>Local persistence proof</h2>
    <p>The page below reads and writes a flat JSON file through the framework’s `.data` contract while preserving the shared layout shell.</p>
  </section>
</template>

<section [contacts-page] :state="{ contacts: [], draftName: '', draftSource: 'desktop' }">
  <style>
    .contacts-page {
      display: grid;
      gap: 1rem;
    }

    .contacts-form,
    .contacts-list {
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }

    .field-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .field-row input {
      width: 100%;
      padding: 0.8rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
    }

    .contact-item {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--line);
    }

    .contact-item:last-child {
      border-bottom: 0;
    }
  </style>

  <article [contacts-form]>
    <h1>Contacts</h1>
    <form>
      <div [field-row]>
        <input name="name" placeholder="Contact name" :bind="draftName" />
        <input name="source" placeholder="Source label" :bind="draftSource" />
      </div>
      <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
        <button type="button" [button] @click="addContact">Save local contact</button>
        <button type="button" [button] [secondary] @click="reload">Reload from file</button>
        <a href="/" [button] [secondary] style="text-decoration:none; display:inline-flex; align-items:center;">Back home</a>
      </div>
    </form>
  </article>

  <article [contacts-list]>
    <h2>Stored contacts</h2>
    <p [muted] :loading="contacts">Syncing local contacts...</p>
    <p [muted] :error="contacts">Could not load or save contacts.</p>
    <div :each="contact in contacts">
      <div [contact-item]>
        <strong>{{ contact.name }}</strong>
        <span>{{ contact.source }}</span>
      </div>
    </div>
  </article>
</section>
