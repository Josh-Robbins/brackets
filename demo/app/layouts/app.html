<div [shell]>
  <style>
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .shell-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 250, 242, 0.94);
      backdrop-filter: blur(12px);
    }

    .shell-brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
    }

    .shell-nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .shell-nav a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
    }

    .shell-main {
      padding: 1.5rem;
    }

    .shell-banner {
      margin-top: 1rem;
    }
  </style>

  <header [shell-bar]>
    <a href="/" [shell-brand]>Brackets</a>
    <nav [shell-nav]>
      <a href="/">Overview</a>
      <a href="/contacts">Contacts</a>
    </nav>
  </header>

  <main [shell-main]>
    <div [shell-banner] :area="'hero'"></div>
    <section :mount></section>
  </main>
</div>
