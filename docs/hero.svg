      <stop stop-color="#f6b48f"/>
      <stop offset="1" stop-color="#c4512c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" rx="40" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="150" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="160" cy="560" r="180" fill="#ffffff" fill-opacity="0.28"/>

  <rect x="76" y="76" width="1048" height="488" rx="36" fill="#fffaf4" stroke="#e7d6c3"/>
