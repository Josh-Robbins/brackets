# Interacts with: tests/test.js, Deno — single gate: jsr + tests/test.js only (no npm: browser deps)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run framework tests (demo RPC + robots + contracts)
        run: deno test tests/test.js --allow-all

  release-artifacts:
    if: hashFiles('release/**') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List release artifacts
        run: find release -type f 2>/dev/null | head -200
      - name: SHA256 checksums
        run: (cd release && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/release-sha256.txt && cat /tmp/release-sha256.txt
