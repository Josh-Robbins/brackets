# Interacts with: tests/test.js, Deno (no Node/npm browser deps)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run framework tests (demo RPC + robots + contracts + CSP nonce)
        run: deno test tests/test.js --allow-all

  contracts-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Host and app contract smoke
        run: |
          deno eval --allow-all <<'DENO'
          import { createServer } from './framework/server.js';
          const instance = await createServer({ appRoot: Deno.cwd(), host: '127.0.0.1', port: 0 });
          try {
            const host = await fetch(`${instance.url}/.well-known/brackets-host.json`).then((response) => response.json());
            const app = await fetch(`${instance.url}/.well-known/brackets-app.json`).then((response) => response.json());
            if (!host?.distribution?.entryPoint) throw new Error('Missing host distribution entryPoint');
            if (!Array.isArray(app?.routes)) throw new Error('Missing app routes contract');
          } finally {
            await instance.close();
          }
          DENO

  release-artifacts:
    if: hashFiles('release/**') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List release artifacts
        run: find release -type f 2>/dev/null | head -200
      - name: SHA256 checksums
        run: (cd release && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/release-sha256.txt && cat /tmp/release-sha256.txt
      - name: Verify release/SHA256SUMS
        run: |
          test -f release/SHA256SUMS
          (cd release && sha256sum -c SHA256SUMS)
