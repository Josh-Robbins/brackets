# Interacts with: tests/test.js, tests/e2e-demo.test.js, Deno
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run framework tests (includes demo HTTP contract)
        run: deno test tests/test.js --allow-all

  demo-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install Chromium (system)
        run: sudo apt-get update && sudo apt-get install -y chromium
      - name: Browser smoke — demo live-data save
        run: deno test tests/e2e-demo.test.js --allow-all
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium

  release-artifacts:
    if: hashFiles('release/**') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List release artifacts
        run: find release -type f 2>/dev/null | head -200
      - name: SHA256 checksums
        run: (cd release && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/release-sha256.txt && cat /tmp/release-sha256.txt
