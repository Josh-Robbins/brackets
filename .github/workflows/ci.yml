# Interacts with: tests/test.js, tests/browser_demo_test.js, Deno + Playwright (browser gate)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run framework tests (demo RPC + robots + contracts)
        run: deno test tests/test.js --allow-all

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium (matches npm:playwright@1.49.1)
        run: npx playwright@1.49.1 install chromium --with-deps
      - name: Browser smoke (demo Live tab + RPC + console)
        run: deno test tests/browser_demo_test.js --allow-all

  release-artifacts:
    if: hashFiles('release/**') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List release artifacts
        run: find release -type f 2>/dev/null | head -200
      - name: SHA256 checksums
        run: (cd release && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/release-sha256.txt && cat /tmp/release-sha256.txt
