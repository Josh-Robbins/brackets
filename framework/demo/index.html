<!doctype html>
<html lang="en">
<head>
  <!--
    Package entry — interacts with docs/guide.md (Framework demo), framework/runtime.js

    This file is only the app entry point for the packaged demo (config entry.folder: framework/demo).
    Routed UI lives under framework/demo/app/ (e.g. app/home/home.view + home.html; app/router.logic; :use fragments; data/, styles at app/).
  -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!--
    Shared entry assets.

    These are global app assets loaded at startup.
    Keep page-specific metadata out of this file.
  -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/app/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=League+Spartan:wght@600;700&display=swap" />
  <link rel="stylesheet" href="/app/styles.css" />

  <!--
    Runtime / bootstrap values.

    csrf:
      Standard CSRF token hook. Leave empty unless the host or backend
      provides a token.

    session:
      Initial session / auth snapshot.

    host:
      Host capabilities, environment info, adapter flags, URLs, etc.

    config:
      Client-safe config mirrored from config.yaml or host startup.
  -->
  <meta name="csrf" content="" />
  <script type="application/json" id="session">{}</script>
  <script type="application/json" id="host">{}</script>
  <script type="application/json" id="config">{}</script>

  <!--
    Import map support check.

    Import maps are used for browser-side module aliases.
    If support is missing, log a warning so the issue is easy to spot.
  -->
  <script>
    if (!HTMLScriptElement.supports?.("importmap")) {
      console.warn("This browser does not support import maps.");
    }
  </script>

  <!--
    Import map.

    @framework/:
      Alias for framework files.

    @app/:
      Alias for the demo app folder.
      The host replaces this map at serve time with the correct paths
      based on the entry.folder setting in config.yaml.

    brackets:
      Alias for the main Brackets runtime entry.
  -->
  <script type="importmap">
  {
    "imports": {
      "@framework/": "/framework/",
      "@app/": "/framework/demo/app/",
      "brackets": "/framework/runtime.js"
    }
  }
  </script>

  <!--
    Brackets runtime entry.

    Load the runtime by alias so the import map is actually being used.
    This should boot the runtime and render the active view into #app-root.
  -->
  <script type="module">
    import "brackets";
  </script>
</head>
<body>
  <noscript>This app requires JavaScript to run.</noscript>

  <main id="app-root"></main>
</body>
</html>
