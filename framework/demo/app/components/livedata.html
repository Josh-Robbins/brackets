<!-- framework/demo/app/components/livedata.html
     Interacts with: app/home/home.html (:use), app/home/home.logic (saveLiveNote, saveLiveEdit), app/data/demo.data, framework/runtime.js
     Live tab: self-contained :state, SSE read, RPC append/update.
-->
<section
  class="brx-live-card"
  aria-labelledby="brx-live-heading"
  :state="{ line: '', demoLog: null, liveSseOk: true, editingId: null, editDraft: '', noteSaveFeedback: 'idle' }"
  :run="read('/__brackets/live?kind=data&module=demo&method=events&route=/&intervalMs=2500', { as: 'state', path: 'demoLog', onOpen: () => mutate('liveSseOk', true), onMessage: () => mutate('liveSseOk', true), onError: () => mutate('liveSseOk', false) }).catch(() => mutate('liveSseOk', false))"
>
  <div class="brx-live-title-row">
    <h3 class="brx-live-heading" id="brx-live-heading">Live data example</h3>
    <div class="brx-live-status" aria-live="polite" aria-atomic="true">
      <p class="brx-sse-badge" :class.brx-sse-badge--live="liveSseOk" :class.brx-sse-badge--delayed="!liveSseOk">
        <span class="brx-sse-pulse" :class.brx-sse-pulse--delayed="!liveSseOk" aria-hidden="true"></span>
        <span class="brx-sse-label" :text="liveSseOk ? 'Live' : 'Delayed'"></span>
      </p>
    </div>
  </div>
  <p class="brx-live-lead">Your notes are saved to a small database file in this app folder, and the list below updates while this page is open.</p>
  <div class="brx-live-form">
    <label class="brx-live-field" for="brx-live-note">
      <span class="brx-live-label-row">
        <span class="brx-live-label-title">Note</span>
        <span
          class="brx-live-save-feedback"
          :class.brx-live-save-feedback--ok="noteSaveFeedback === 'saved'"
          :class.brx-live-save-feedback--bad="noteSaveFeedback === 'failed' || noteSaveFeedback === 'offline'"
          :show="noteSaveFeedback === 'saved' || noteSaveFeedback === 'failed' || noteSaveFeedback === 'offline'"
          :text="noteSaveFeedback === 'saved' ? 'Saved.' : (noteSaveFeedback === 'offline' ? 'Could not reach host.' : (noteSaveFeedback === 'failed' ? 'Not saved.' : ''))"
          role="status"
        ></span>
      </span>
      <input id="brx-live-note" name="brx-live-note" type="text" :bind="line" placeholder="Type a note" autocomplete="off" />
    </label>
    <button type="button" class="brx-button brx-button--soft" @click="saveLiveNote">Save</button>
  </div>
  <div class="brx-live-table-wrap">
    <p class="brx-live-empty" :show="!demoLog || !demoLog.events || !demoLog.events.length">No notes yet. Add a note above and choose Save.</p>
    <table class="brx-live-table" :show="demoLog && demoLog.events && demoLog.events.length">
      <caption class="brx-sr-only">Notes saved on disk; updated live from the host.</caption>
      <thead>
        <tr>
          <th scope="col">Time</th>
          <th scope="col">Text</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody>
        <template :each="row in demoLog && demoLog.events ? demoLog.events : []">
          <tr>
            <td :text="row.at"></td>
            <td class="brx-live-text-cell">
              <span :if="editingId !== row.id" :text="row.text"></span>
              <template :if="editingId === row.id">
                <input class="brx-live-inline-input" type="text" name="brx-live-edit" :bind="editDraft" aria-label="Edit note" />
              </template>
            </td>
            <td class="brx-live-actions">
              <button type="button" class="brx-button brx-button--soft brx-live-action-btn" :show="editingId !== row.id" @click="mutate('editDraft', row.text); mutate('editingId', row.id)">Edit</button>
              <span class="brx-live-edit-actions" :show="editingId === row.id">
                <button type="button" class="brx-button brx-button--soft brx-live-action-btn" @click="saveLiveEdit">Save</button>
                <button type="button" class="brx-button brx-button--soft brx-live-action-btn" @click="mutate('editingId', null); mutate('editDraft', '')">Cancel</button>
              </span>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
  <p class="brx-health-updated" :show="demoLog && demoLog.updatedAt" :text="demoLog && demoLog.updatedAt ? ('Updated ' + demoLog.updatedAt) : ''"></p>
</section>
